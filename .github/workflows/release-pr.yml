name: Create Release PR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  create_release_pr:
    name: Create Release Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests in all workspaces
        run: pnpm -w -r test

      - name: Build all packages
        run: pnpm -w -r build

      - name: Generate version changes (Changesets)
        run: pnpm version:changeset

      - name: Generate release summary
        run: |
          set -e
          # Generate a readable Changesets status; allow it to fail gracefully
          pnpm changeset status --verbose > release_summary.txt || true

      - name: Create release branch and push
        id: create_branch
        run: |
          set -e
          BRANCH=release/bump-$(date +%s)
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH
          git add -A
          git commit -m "chore(release): version packages [skip ci]" || echo "No changes to commit"
          git push -u origin $BRANCH

      - name: Build PR body content
        id: pr_body
        run: |
          if [ -f release_summary.txt ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            cat .github/PULL_REQUEST_TEMPLATE/release.md >> $GITHUB_OUTPUT
            echo "\n\n---\n\n" >> $GITHUB_OUTPUT
            cat release_summary.txt >> $GITHUB_OUTPUT
            echo "\n\n---\n\n(Generated by Changesets)\nEOF" >> $GITHUB_OUTPUT
          else
            echo "body<<EOF" >> $GITHUB_OUTPUT
            cat .github/PULL_REQUEST_TEMPLATE/release.md >> $GITHUB_OUTPUT
            echo "\n\n_No summary available_\nEOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.create_branch.outputs.branch }}
          base: main
          title: "chore(release): version bump"
          body: ${{ steps.pr_body.outputs.body }}
          labels: "release"
