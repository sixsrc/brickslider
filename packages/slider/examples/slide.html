    <script type="module">
      import { BrickSlider } from "../dist/brick-slider.js"

      const slider4 = new BrickSlider("#slide4_container", {

      slider4.init()

      const slider = new BrickSlider("#slide1_container", {

        spacing: 20

      slider.init()

      const slider2 = new BrickSlider("#slide2_container", {
        arrows: true,
        spacing: 20

      slider2.init()

      slider3.init()
