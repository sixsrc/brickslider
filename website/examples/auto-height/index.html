<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider@1.0.17/lib/brick-slider.css" />
    <link rel="stylesheet" href="../shared.css" />
    <title>Auto Height Example</title>
    <script src="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider@1.0.17/lib/brick-slider.browser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider-accessibility@1.0.10/lib/brick-slider-accessibility.browser.js"></script>
  </head>
  <body>
    <div class="example-page">
      <div id="slider" class="bs-hidden bs-auto-height-layout example-slider example-slider--auto-height">
        <button class="bs-arrow bs-prev example-arrow example-prev" type="button"></button>
        <button class="bs-arrow bs-next example-arrow example-next" type="button"></button>
        <div class="bs-pages example-pages"></div>
        <div class="bs-track example-track">
          <div class="bs-container example-container"></div>
        </div>
        <ul class="bs-dots example-dots">
          <li class="bs-dot example-dot"></li>
        </ul>
      </div>
    </div>

    <script type="module">
      import { arrowNextSvg, arrowPrevSvg, createAutoHeightSlides, mountSlider } from "../shared.js"

      document.querySelector(".bs-prev").innerHTML = arrowPrevSvg()
      document.querySelector(".bs-next").innerHTML = arrowNextSvg()
      createAutoHeightSlides(document.querySelector(".bs-container"))

      mountSlider("#slider", {
        slidesPerView: 1,
        slidesPerPage: 1,
        gap: 20,
        useAutoHeight: true,
        useLoop: true
      })
    </script>
  </body>
</html>
