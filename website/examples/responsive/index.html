<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider@1.0.12/lib/brick-slider.css" />
    <link rel="stylesheet" href="../shared.css" />
    <title>Responsive Example</title>
    <script src="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider@1.0.12/lib/brick-slider.browser.js"></script>
  </head>
  <body>
    <div class="example-page">
      <div class="example-notice">
        <strong>Resize this area:</strong> reduce the browser width to watch the layout move from
        <strong>4</strong> visible slides to <strong>3</strong>, then <strong>2</strong>, then <strong>1</strong>.
      </div>
      <div class="example-notice-actions">
        <a href="/examples/responsive/" target="_blank" rel="noreferrer">Open example in new tab</a>
      </div>

      <div id="slider" class="bs-hidden example-slider example-slider--wide">
        <button class="bs-arrow bs-prev example-arrow example-prev" type="button"></button>
        <button class="bs-arrow bs-next example-arrow example-next" type="button"></button>
        <div class="bs-pages example-pages"></div>
        <div class="bs-track example-track">
          <div class="bs-container example-container"></div>
        </div>
        <ul class="bs-dots example-dots">
          <li class="bs-dot example-dot"></li>
        </ul>
      </div>
    </div>

    <script type="module">
      import { arrowNextSvg, arrowPrevSvg, createSlides, mountSlider } from "../shared.js"

      document.querySelector(".bs-prev").innerHTML = arrowPrevSvg()
      document.querySelector(".bs-next").innerHTML = arrowNextSvg()
      createSlides(document.querySelector(".bs-container"), 8)

      mountSlider("#slider", {
        slidesPerView: 1,
        slidesPerPage: 1,
        gap: 20,
        screens: {
          xs: 320,
          sm: 540,
          md: 768,
          lg: 1024,
          xl: 1280
        },
        responsive: {
          xs: {
            slidesPerView: 1,
            slidesPerPage: 1
          },
          sm: {
            slidesPerView: 2,
            slidesPerPage: 1
          },
          md: {
            slidesPerView: 2,
            slidesPerPage: 2
          },
          lg: {
            slidesPerView: 3,
            slidesPerPage: 2
          },
          xl: {
            slidesPerView: 4,
            slidesPerPage: 4
          }
        },
        useLoop: true
      })
    </script>
  </body>
</html>
