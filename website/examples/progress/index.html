<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider@1.0.18/lib/brick-slider.css" />
    <link rel="stylesheet" href="../shared.css" />
    <title>Progress Example</title>
    <script src="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider@1.0.18/lib/brick-slider.browser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider-accessibility@1.0.11/lib/brick-slider-accessibility.browser.js"></script>
  </head>
  <body>
    <div class="example-page">
      <div id="slider" class="bs-hidden example-slider example-slider--wide example-slider--progress">
        <button class="bs-arrow bs-prev example-arrow example-prev" type="button"></button>
        <button class="bs-arrow bs-next example-arrow example-next" type="button"></button>
        <div class="bs-pages example-pages"></div>
        <div class="bs-track example-track example-track--peek">
          <div class="bs-container example-container"></div>
        </div>
        <div class="bs-progress example-progress">
          <span class="bs-progress-bar example-progress-bar"></span>
        </div>
      </div>
    </div>

    <script type="module">
      import { arrowNextSvg, arrowPrevSvg, createSlides, mountSlider } from "../shared.js"

      document.querySelector(".bs-prev").innerHTML = arrowPrevSvg()
      document.querySelector(".bs-next").innerHTML = arrowNextSvg()
      createSlides(document.querySelector(".bs-container"), 8)

      mountSlider("#slider", {
        slidesPerView: 2,
        slidesPerPage: 2,
        gap: 20,
        useLoop: true
      })
    </script>
  </body>
</html>
