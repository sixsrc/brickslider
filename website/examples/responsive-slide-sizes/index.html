<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider@1.0.14/lib/brick-slider.css" />
    <link rel="stylesheet" href="../shared.css" />
    <title>Responsive + SlideSizes Example</title>
    <script src="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider@1.0.14/lib/brick-slider.browser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@sixsrc/brick-slider-accessibility@1.0.9/lib/brick-slider-accessibility.browser.js"></script>
  </head>
  <body>
    <div class="example-page">
      <div class="example-notice">
        <strong>Resize this area:</strong> each breakpoint changes both the number of visible slides
        <strong>and</strong> the slide widths, so the layout should feel noticeably different as the screen gets smaller.
      </div>

      <div id="slider" class="bs-hidden example-slider example-slider--wide">
        <button class="bs-arrow bs-prev example-arrow example-prev" type="button"></button>
        <button class="bs-arrow bs-next example-arrow example-next" type="button"></button>
        <div class="bs-pages example-pages"></div>
        <div class="bs-track example-track">
          <div class="bs-container example-container"></div>
        </div>
        <ul class="bs-dots example-dots">
          <li class="bs-dot example-dot"></li>
        </ul>
      </div>
    </div>

    <script type="module">
      import { arrowNextSvg, arrowPrevSvg, createSlides, mountSlider } from "../shared.js"

      document.querySelector(".bs-prev").innerHTML = arrowPrevSvg()
      document.querySelector(".bs-next").innerHTML = arrowNextSvg()
      createSlides(document.querySelector(".bs-container"), 8)

      mountSlider("#slider", {
        slidesPerView: 1,
        slidesPerPage: 1,
        gap: 20,
        screens: {
          xs: 320,
          sm: 540,
          md: 768,
          lg: 1024,
          xl: 1280
        },
        responsive: {
          xs: {
            slidesPerView: 1,
            slidesPerPage: 1,
            useSlideSizes: false
          },
          sm: {
            slidesPerView: 2,
            slidesPerPage: 1,
            slideSizes: {
              0: 65,
              1: 35
            }
          },
          md: {
            slidesPerView: 2,
            slidesPerPage: 2,
            slideSizes: {
              0: 30,
              1: 70
            }
          },
          lg: {
            slidesPerView: 3,
            slidesPerPage: 2,
            slideSizes: {
              0: 50,
              1: 30,
              2: 20
            }
          },
          xl: {
            slidesPerView: 4,
            slidesPerPage: 4,
            slideSizes: {
              0: 38,
              1: 22,
              2: 20,
              3: 20
            }
          }
        },
        useLoop: true
      })
    </script>
  </body>
</html>
